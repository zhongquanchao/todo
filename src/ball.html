<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悬浮球</title>
    <script type="module" src="/ball.js" defer></script>
  </head>
  <body class="ball-body">
    <div id="ball" class="ball">
      <!-- 外层玻璃环：随球整体拖动（见 ball.js 手势处理） -->
      <div class="ball-drag"></div>
      <!-- 中心水滴：点击展开面板（以球当前位置为锚点） -->
      <button class="ball-core" id="expand" title="展开待办">
        <span class="ball-count" id="count">0</span>
      </button>
    </div>
  </body>
</html>
