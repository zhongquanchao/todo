name: Bug 报告
description: 报告一个 bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
      placeholder: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个 bug
      placeholder: |
        1. 打开应用
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统及版本
      placeholder: macOS 14 / Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 见「关于」或安装包文件名
      placeholder: v1.0.1
